name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Prepare Android Binary
        run: cp build/app/outputs/flutter-apk/app-release.apk 2048-android-v1.0.0.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: 2048-android-v1.0.0.apk

  build_windows:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Archive Windows Build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath 2048-windows-v1.0.0.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: 2048-windows-v1.0.0.zip

  build_web:
    name: Build Web Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Release
        run: flutter build web --release

      - name: Archive Web Build
        run: cd build/web && zip -r ../../2048-web-v1.0.0.zip .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: 2048-web-v1.0.0.zip

  build_macos:
    name: Build macOS Application
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Archive macOS Build
        run: cd build/macos/Build/Products/Release && zip -r ../../../../../2048-macos-v1.0.0.zip flutter_2048.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: 2048-macos-v1.0.0.zip

  build_linux:
    name: Build Linux Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Archive Linux Build
        run: tar -czvf 2048-linux-v1.0.0.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: 2048-linux-v1.0.0.tar.gz

  publish_release:
    name: Publish GitHub Release
    needs: [build_android, build_windows, build_web, build_macos, build_linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Flutter 2048 v1.0.0
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./artifacts/2048-android-v1.0.0.apk
            ./artifacts/2048-windows-v1.0.0.zip
            ./artifacts/2048-web-v1.0.0.zip
            ./artifacts/2048-macos-v1.0.0.zip
            ./artifacts/2048-linux-v1.0.0.tar.gz
